[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-analytics-office"
version = "1.0.0"
description = "Deterministic evaluation harness for a Dockerized, Slack-operated multi-agent analytics office."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Lee2379"}]
keywords = ["ai-agents", "data-science", "multi-agent", "docker", "slack", "forecasting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
agentic-office = "agentic_analytics_office.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
