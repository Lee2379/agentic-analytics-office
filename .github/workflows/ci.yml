name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Generate deterministic workflow artifacts
        run: >-
          agentic-office run
          --products data/sample_products.csv
          --sales data/sample_sales.csv
          --output artifacts/ci_run
      - name: Privacy and credential scan
        run: python scripts/privacy_scan.py .
      - name: Verify reviewed evidence images
        run: python scripts/verify_evidence_images.py
      - name: Build hardened offline image
        run: docker build -t agentic-analytics-office:ci .
