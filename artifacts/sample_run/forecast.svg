<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Chronological holdout evaluation and seven-day demand forecast</title>
<desc id="desc">The left panel compares actual holdout demand with baseline predictions. The right panel shows future predicted daily units.</desc>
<style>
  .bg { fill:#081c24; } .grid { stroke:#21434d; stroke-width:1; }
  .axis { fill:#b9c9ce; font:12px system-ui,sans-serif; }
  .heading { fill:#f5f8f9; font:600 20px system-ui,sans-serif; }
  .sub { fill:#9fb4bb; font:13px system-ui,sans-serif; }
  .actual { fill:none; stroke:#28c2a0; stroke-width:4; }
  .pred { fill:none; stroke:#f58b45; stroke-width:3; stroke-dasharray:8 6; }
  .future { fill:none; stroke:#5aa9ff; stroke-width:4; }
  .legend { fill:#dbe6e9; font:13px system-ui,sans-serif; }
</style>
<rect class="bg" width="100%" height="100%" rx="16"/>
<text x="70" y="30" class="heading">Demand forecast evaluation</text>
<text x="70" y="52" class="sub">Chronological split · no holdout leakage · units/day</text>
<line x1="70" y1="375.0" x2="440" y2="375.0" class="grid"/><line x1="555" y1="375.0" x2="925" y2="375.0" class="grid"/><line x1="70" y1="306.2" x2="440" y2="306.2" class="grid"/><line x1="555" y1="306.2" x2="925" y2="306.2" class="grid"/><line x1="70" y1="237.5" x2="440" y2="237.5" class="grid"/><line x1="555" y1="237.5" x2="925" y2="237.5" class="grid"/><line x1="70" y1="168.7" x2="440" y2="168.7" class="grid"/><line x1="555" y1="168.7" x2="925" y2="168.7" class="grid"/><line x1="70" y1="100.0" x2="440" y2="100.0" class="grid"/><line x1="555" y1="100.0" x2="925" y2="100.0" class="grid"/><text x="58" y="379.0" text-anchor="end" class="axis">27</text><text x="58" y="310.2" text-anchor="end" class="axis">32</text><text x="58" y="241.5" text-anchor="end" class="axis">37</text><text x="58" y="172.7" text-anchor="end" class="axis">41</text><text x="58" y="104.0" text-anchor="end" class="axis">46</text>
<text x="70" y="82" class="legend">Holdout: actual vs baseline prediction</text>
<text x="555" y="82" class="legend">Future: seven-day baseline</text>
<g><polyline points="70.0,320.1 131.7,290.6 193.3,305.4 255.0,261.1 316.7,231.6 378.3,172.6 440.0,202.1" class="actual"/><polyline points="70.0,261.8 131.7,254.8 193.3,247.8 255.0,240.8 316.7,233.8 378.3,226.8 440.0,219.8" class="pred"/><text x="70.0" y="397" text-anchor="middle" class="axis">06-29</text><text x="255.0" y="397" text-anchor="middle" class="axis">07-02</text><text x="440.0" y="397" text-anchor="middle" class="axis">07-05</text></g>
<g><polyline points="555.0,220.2 616.7,213.4 678.3,206.7 740.0,199.9 801.7,193.2 863.3,186.4 925.0,179.7" class="future"/><text x="555.0" y="397" text-anchor="middle" class="axis">07-06</text><text x="740.0" y="397" text-anchor="middle" class="axis">07-09</text><text x="925.0" y="397" text-anchor="middle" class="axis">07-12</text></g>
<g transform="translate(68,418)"><line x1="0" y1="0" x2="24" y2="0" class="actual"/><text x="32" y="4" class="legend">actual</text>
<line x1="105" y1="0" x2="129" y2="0" class="pred"/><text x="137" y="4" class="legend">holdout prediction</text>
<line x1="310" y1="0" x2="334" y2="0" class="future"/><text x="342" y="4" class="legend">future forecast</text></g>
</svg>